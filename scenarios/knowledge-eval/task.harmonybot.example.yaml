# v2配置示例：按实际数据集、工具链和模型配置替换路径。
schema_version: 2
scenario: KnowledgeEval
id: harmonybot-d2h-mcp
description: 比较同一 HarmonyBot d2h Agent 在有无 MCP 时的答案质量
dataset:
  type: text-qa
  dir: "../../datasets/knowledge-qa"
target:
  type: harmonybot_agent
  dir: /path/to/vscode/extensions
harmonybot_agent:
  rounds: 1
  static_eval: {}
  execution:
    engine: opencode
    agent_name: d2h
    timeout: 120
    opencode:
      config_path: "./opencode.harmonybot.example.json"
    model:
      api_type: openai_api
      name: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: DASHSCOPE_API_KEY
  verification:
  - id: qa
    type: LLM_judge
    model:
      api_type: openai_api
      name: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: DASHSCOPE_API_KEY
    prompt_path: "./rubric.example.md"
  - id: usage
    type: ToolUsage
    target_mcp: developer_knowledge
    mode: observe
  scoring:
  - dimension: answer_quality
    type: ImmediateValue
    source: qa.metrics.score
  report:
    output_dir: "../../outputs/harmonybot-d2h-mcp"
    format: html
