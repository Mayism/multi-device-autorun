# v2配置示例：按实际数据集、工具链和模型配置替换路径。
schema_version: 2
scenario: QuestionAnswering
id: opencode-selected-agent
description: 使用文本问题评测 OpenCode 中指定的 Agent
dataset:
  type: text-qa
  dir: "../../datasets/qa"
target:
  type: opencode_agent
opencode_agent:
  rounds: 1
  execution:
    engine: opencode
    agent_name: qa-agent
    timeout: 120
    model:
      api_type: openai_api
      name: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: DASHSCOPE_API_KEY
    opencode:
      binary: /path/to/opencode
      config_path: "./opencode-agents.example.json"
  verification:
  - id: qa
    type: LLM_judge
    model:
      api_type: openai_api
      name: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: DASHSCOPE_API_KEY
    prompt_path: "./rubric.example.md"
  scoring:
  - dimension: answer_quality
    type: ImmediateValue
    source: qa.metrics.score
  report:
    output_dir: "../../outputs/opencode-selected-agent"
    format: html
