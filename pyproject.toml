[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-device-autorun-python"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
whitebox = ["PyYAML>=6,<7", "jsonschema>=4.23,<4.26"]

[project.scripts]
autorun = "pyautorun.orchestration.cli:main"
autorun-cloudtest = "pyautorun.cloud.cloudtest_cli:main"
ohostest-case = "pyautorun.devices.ohostest_case:main"
ohostest-matrix = "pyautorun.devices.ohostest_matrix:main"
deploy-fold-trigger = "pyautorun.devices.deploy_fold:main"
autorun-report = "pyautorun.reporting.report_cli:main"
autorun-archive = "pyautorun.reporting.archive_cli:main"
ask-opencode = "pyautorun.runtime.ask_opencode:main"
serve-opencode = "pyautorun.runtime.serve_opencode:main"
whitebox-evaluate = "pyautorun.whitebox_eval.runtime.local:main"
whitebox-remote = "pyautorun.whitebox_eval.service.remote:main"
whitebox-api = "pyautorun.whitebox_eval.service.api:main"

[tool.setuptools]
package-dir = {"pyautorun" = "src"}
packages = [
  "pyautorun", "pyautorun.cloud", "pyautorun.devices", "pyautorun.orchestration",
  "pyautorun.reporting", "pyautorun.runtime", "pyautorun.whitebox_eval",
  "pyautorun.whitebox_eval.resources", "pyautorun.whitebox_eval.rules",
  "pyautorun.whitebox_eval.runtime", "pyautorun.whitebox_eval.scoring",
  "pyautorun.whitebox_eval.service",
]

[tool.setuptools.package-data]
"pyautorun.devices" = ["FoldTrigger.ets", "fold-server.py"]
"pyautorun.reporting" = ["report.css"]
"pyautorun.whitebox_eval.resources" = [
  "official_profiles.json",
  "references/risks/*.yaml",
  "references/rules/*.yaml", "references/rules/*.md",
  "references/scoring/*.yaml", "references/scoring/*.json", "references/scoring/*.md",
  "opencode/*.json", "opencode/formatters/*.py", "opencode/prompts/*.md",
  "opencode/skills/*/*.md",
]
