[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonyeval"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
whitebox = ["PyYAML>=6,<7", "jsonschema>=4.23,<4.26"]
eval = [
  "evalscope>=1.14.1,<1.15", "PyYAML>=6,<7", "jsonschema>=4.23,<4.26",
  "tree-sitter>=0.25,<0.26", "tree-sitter-dart==0.1.0", "tree-sitter-typescript==0.23.2",
  "tree-sitter-javascript==0.25.0", "tree-sitter-java==0.23.5", "tree-sitter-kotlin==1.1.0",
]

[project.scripts]
harmonyeval = "harmonyeval.cli:main"
ohostest-case = "harmonyeval.integrations.uitest.ohostest_case:main"
ohostest-matrix = "harmonyeval.integrations.uitest.ohostest_matrix:main"
deploy-fold-trigger = "harmonyeval.integrations.uitest.deploy_fold:main"
ask-opencode = "harmonyeval.agent.opencode.ask_opencode:main"
whitebox-evaluate = "harmonyeval.integrations.whitebox.runtime.local:main"
whitebox-remote = "harmonyeval.integrations.whitebox.service.remote:main"
whitebox-api = "harmonyeval.integrations.whitebox.service.api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harmonyeval*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
"harmonyeval.integrations.uitest" = ["FoldTrigger.ets", "fold-server.py"]
"harmonyeval.report" = ["report.css"]
"harmonyeval.integrations.whitebox.resources" = [
  "official_profiles.json",
  "references/risks/*.yaml",
  "references/rules/*.yaml", "references/rules/*.md",
  "references/scoring/*.yaml", "references/scoring/*.json", "references/scoring/*.md",
  "opencode/*.json", "opencode/formatters/*.py", "opencode/prompts/*.md",
  "opencode/skills/*/*.md",
]
"harmonyeval.integrations.whitebox" = [
  "ark_analyzer/*.json", "ark_analyzer/README.md",
  "ark_analyzer/src/rules/arkfacts/*.ts", "ark_analyzer/dist/rules/arkfacts/*.js",
]
