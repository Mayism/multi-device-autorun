# base 已恢复为修复前状态：targetSdkVersion 和 compatibleSdkVersion 均为 5.0.0(12)。
# PROMPT.md 要求升级到 26.0.0（26）并维持应用行为；现有 UITest 按 target 验证对应行为，
# 通过不代表已验证旧行为保持不变；如需验收该目标，须另行补充断言。
# --check 只验证配置和能力装载，不验证 AGC 身份、配额、签名或远端设备可用性。
# 独立 OpenCode + API 升级 Skill；工程用例复用一多目录适配器。
# 提示词逐字读取每个用例的 PROMPT.md；两组均使用 build，仅切换目标 Skill 加载。
# Skill 默认 activation=auto；加载不代表实际使用，调用记录见 agent-output。
# 云测试沿用现有默认类别 24；需要 AGC_TEAM_ID、AGC_PROJECT_ID。
# 云认证取 config/agc-cookie.txt 的非空内容，或环境变量 AGC_AUTH_INFO。
# 评分：各流程完整通过=100、实际验收失败=0、缺环境/证据=unavailable。
# 本机模型和签名配置含凭据，提交版本应使用脱敏配置。
schema_version: 2
scenario: APIUpgrade
id: api-upgrade-skill
description: 比较独立 OpenCode 加载/不加载 harmonyos-api-upgrade-adapter 的 API 升级任务执行结果
dataset:
  type: swe-bench-hm-multi-dev
  dir: /Users/mayism/apiupgrade
target:
  type: skills
  dir: /Users/mayism/Downloads/harmonyos-api-upgrade-adapter
skills:
  rounds: 1
  static_eval: {}
  execution:
    engine: opencode
    agent_name: build
    without_enable: true
    timeout: 3600
    idle_timeout: 3600
    concurrency: 1
    enviroment:
      deveco_home: /Applications/DevEco-Studio.app/Contents
      sdk_home: /Applications/DevEco-Studio.app/Contents/sdk
      java_home: /Applications/DevEco-Studio.app/Contents/jbr/Contents/Home
    model:
      api_type: openai_api
      name: glm-5.3
      base_url: https://open.bigmodel.cn/api/coding/paas/v4
      api_key: "ZHIPU_API_KEY"
  verification:
  - id: ui
    type: UITest
    deveco_home: /Applications/DevEco-Studio.app/Contents
    emulator_deployed_dir: /Users/mayism/.Huawei/Emulator/deployed
    timeout: 7200
    paths:
      hvigorw: /Applications/DevEco-Studio.app/Contents/tools/hvigor/bin/hvigorw
      ohpm: /Applications/DevEco-Studio.app/Contents/tools/ohpm/bin/ohpm
      hdc: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains/hdc
      emulatorBin: /Applications/DevEco-Studio.app/Contents/tools/emulator/Emulator
    devices:
    - id: phone
      profile: Pura 90 Pro
      target: 127.0.0.1:15001
      hdc_port: 15001
      start_emulator: true
  - id: cloud
    type: CloudTest
    testCategories:
    - category: 24
      timeSpan: 60
    buildTimeoutSec: 1800
    taskTimeoutSec: 7200
    pollIntervalSec: 60
    product: default
    buildMode: release
    signingConfigs:
    - name: default
      type: HarmonyOS
      material:
        storeFile: /Users/mayism/code/multi-device-autorun/config/signing/test.p12
        profile: /Users/mayism/code/multi-device-autorun/config/signing/test.p7b
        certpath: /Users/mayism/code/multi-device-autorun/config/signing/test.cer
  scoring:
  - dimension: uitest
    type: BooleanScoring
    all:
    - source: ui.metrics.build_passed
      equals: true
    - source: ui.metrics.all_tests_passed
      equals: true
    pass_score: 100
    fail_score: 0
  - dimension: cloud_test
    type: BooleanScoring
    all:
    - source: cloud.metrics.passed
      equals: true
    pass_score: 100
    fail_score: 0
  report:
    output_dir: ../output/harmony-eval/api-upgrade-skill
    format: html
