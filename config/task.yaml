# 本机thirdcase配置。模型按实际服务配置，api_key可填环境变量名或直接填写密钥。
# 当前先评API数量一致率和白盒L3，不要求功能验收命令/API映射；数量一致不代表适配功能正确。
# 仅target.type对应的配置块生效，其他块保留作为配置目录。
scenario: LibraryMigration
id: thirdcase-library-plugin
description: 评测hmos-library-adapter-fast转换thirdcase库的效果
dataset:
  type: library-migration
  dir: /Users/mayism/thirdcase
  layout: repositories
  instruction: 请将当前第三方库适配到HarmonyOS，在当前工程内完成实现。阅读README和源码，保持原有公开API及已有平台行为，识别并处理依赖的鸿蒙兼容性；对于无法等价实现的平台能力，明确说明限制与替代方案，不得虚构API或用空实现冒充支持。请提供使用说明和构建、验证结果。
target:
  type: plugin_agent
  dir: /Users/mayism/.config/opencode/plugins/hmos-library-adapter-fast
skills:
  rounds: 1
  execution:
    engine: opencode
    model:
      api_type: openai_api
      name: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: DASHSCOPE_API_KEY
    timeout: 900
    without_enable: true  # true：追加不加载评测对象的 without 组，并与 with 组自动比较；false：只跑 with
  verification:
  - type: UITest
    deveco_home: xxxx
    emulator_deployed_dir: null
    flutter_home: null
  - type: CloudTest
    test_category: UI,Security&Privacy
  - type: whiteboxeval
  - type: LLM_judge
  scoring:
  - dimension: L1
    type: BooleanScoring
  - dimension: L2
    type: WeightedSummation
  - dimension: L3
    type: ImmediateValue
  report:
    output_dir: outputs/harmonybot-vs-opencode-skills
    format: html
harmonybot_agent:
  static_eval:
    model:
      api_type: openai_api
      name: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: DASHSCOPE_API_KEY
  rounds: 1
  execution:
    engine: opencode
    agent_name: 一多适配Agent
    model:
      name: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: DASHSCOPE_API_KEY
    timeout: 900
    opencode:
      config_path: null
  verification:
  - type: UITest
  - type: CloudTest
    test_category: UI,Security&Privacy
  - type: AGCDetection
  - type: LLM_judge
    prompt_path: /path
  scoring:
  - dimension: L1
    type: BooleanScoring
  - dimension: L2
    type: WeightedSummation
  - dimension: L3
    type: ImmediateValue
  report:
    output_dir: outputs/harmonybot-vs-opencode-skills
    format: html
plugin_agent:
  rounds: 1
  static_eval: {}
  execution:
    engine: opencode
    agent_name: hmos-library-adapter-fast
    without_enable: false  # true：追加不加载评测对象的 without 组，并与 with 组自动比较；false：只跑 with
    timeout: 3600
    idle_timeout: 3600 # 子Agent运行时主会话可能长期无输出，保留总时限控制
    enviroment:
      deveco_home: /Applications/DevEco-Studio.app/Contents
    model:
      api_type: openai_api
      name: glm-4.7
      max_tokens: 8192
      temperature: 0.7
      base_url: https://open.bigmodel.cn/api/coding/paas/v4
      api_key: ZHIPU_API_KEY
  verification:
  - id: api
    type: LibraryAPICount
  - id: code
    type: whiteboxeval
    rubric_path: ./rubrics/library-migration.md
  scoring:
  - dimension: api_count_consistency
    type: ImmediateValue
    source: api.metrics.count_consistency
    scale: 100
  - dimension: L3
    type: ImmediateValue
    source: code.metrics.total_score
  report:
    output_dir: ../output/harmony-eval/thirdcase-plugin
    format: html
opencode_agent:
  rounds: 1
  execution:
    engine: opencode
    agent_name: build
    model:
      api_type: openai_api
      name: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: DASHSCOPE_API_KEY
    timeout: 900
    opencode:
      binary: null
      config_path: null
  verification: null
  scoring: null
  report: null
http_agent:
  rounds: 1
  execution:
    http_url: null
    method: null
  verification: null
  scoring: null
  report: null
knowledge:
  rounds: 1
  execution:
    engine: http
    http_url: null
    method: POST
    timeout: 120
  verification: null
  scoring: null
  report:
    output_dir: outputs/knowledge-qa
    format: html
knowledge_agent:
  rounds: 1
  without_enable: true  # true：追加不加载评测对象的 without 组，并与 with 组自动比较；false：只跑 with
  without_process: python命令
  host_target:
    type: skills/harmonybot_agent/plugin_agent
    dir: /target/path
schema_version: 2
