# 同一 Agent/模型/问题/评分；仅目标 MCP enabled 不同，不使用 without_enable。
# 当前使用与已有任务相同的本机模型密钥；公开提交前改为环境变量引用。
schema_version: 2
scenario: KnowledgeEval
id: huawei-mcp-qa
description: 同一独立 OpenCode Agent 在有/无华为开发者知识 MCP 时的问答对照
dataset:
  type: text-qa
  dir: ../../data/cases.json
target:
  type: opencode_agent
opencode_agent:
  rounds: 1
  static_eval: {}
  execution:
    engine: opencode
    agent_name: build
    timeout: 900
    idle_timeout: 900
    concurrency: 1
    opencode:
      config_path: ../opencode.without.json
    model:
      api_type: openai_api
      name: glm-5.3
      base_url: https://open.bigmodel.cn/api/coding/paas/v4
      api_key: "ZHIPU_API_KEY"
      max_tokens: 8192
      temperature: 0
  verification:
  - id: quality
    type: LLM_judge
    prompt_path: ../rubric.md
  - id: usage
    type: ToolUsage
    target_mcp: harmonyos_developer_knowledge
    mode: observe
  scoring:
  - dimension: answer_quality
    type: ImmediateValue
    source: quality.metrics.score
  report:
    output_dir: ../../../../output/harmony-eval/huawei-mcp-qa
    format: html
